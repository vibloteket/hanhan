<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MànMàn icon</title>
  <desc id="desc">A red rounded-square app icon with the Chinese character 慢, a friendly snail, and a small completion check.</desc>
  <defs>
    <linearGradient id="redGrad" x1="180" y1="120" x2="844" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6694f"/>
      <stop offset="0.55" stop-color="#d73b2f"/>
      <stop offset="1" stop-color="#bd271f"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="380" y1="600" x2="540" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe6b4"/>
      <stop offset="1" stop-color="#f5c879"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="610" y1="650" x2="790" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#f0a81f"/>
    </linearGradient>
    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#3a180f" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5b1c13" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="208" fill="url(#redGrad)" filter="url(#outerShadow)"/>

  <text x="512" y="388" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"
    font-size="328" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="#fff8e8"
    filter="url(#softShadow)">慢</text>

  <g transform="translate(496 690)" filter="url(#softShadow)">
    <path d="M -170 78 Q -170 20 -110 20 L 70 20 Q 90 20 106 4" fill="none" stroke="#fff8e8" stroke-width="38" stroke-linecap="round"/>
    <path d="M 96 8 Q 118 -38 146 -58" fill="none" stroke="#fff8e8" stroke-width="24" stroke-linecap="round"/>
    <path d="M 68 14 Q 80 -30 98 -52" fill="none" stroke="#fff8e8" stroke-width="24" stroke-linecap="round"/>
    <circle cx="150" cy="-64" r="15" fill="#ffd9a0"/>
    <circle cx="102" cy="-58" r="12" fill="#ffd9a0"/>
    <circle cx="-66" cy="6" r="88" fill="url(#shellGrad)"/>
    <path d="M -66 6 m 0 -56 a 56 56 0 1 1 -40 18" fill="none" stroke="#bd271f" stroke-width="24" stroke-linecap="round"/>
    <circle cx="-66" cy="6" r="18" fill="#bd271f"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="748" cy="752" r="78" fill="url(#goldGrad)" stroke="#fff8e8" stroke-width="22"/>
    <path d="M710 753 L738 781 L788 718" fill="none" stroke="#7a3b00" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
