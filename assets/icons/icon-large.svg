<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">HànHàn icon</title>
  <desc id="desc">A red rounded-square app icon with a cream flashcard, the Chinese character 汉, and a small completion check.</desc>
  <defs>
    <linearGradient id="redGrad" x1="180" y1="120" x2="844" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f25b43"/>
      <stop offset="0.55" stop-color="#d73b2f"/>
      <stop offset="1" stop-color="#a91f1a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="310" y1="250" x2="700" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#fff1d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="610" y1="650" x2="790" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#f0a81f"/>
    </linearGradient>
    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#3a180f" flood-opacity="0.22"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5b1c13" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="208" fill="url(#redGrad)" filter="url(#outerShadow)"/>

  <g transform="rotate(-7 512 512)" filter="url(#cardShadow)">
    <rect x="286" y="244" width="452" height="536" rx="78" fill="url(#cardGrad)"/>
    <rect x="286" y="244" width="452" height="536" rx="78" fill="none" stroke="#ffe2a8" stroke-width="10" opacity="0.75"/>
    <text x="512" y="526"
      font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif"
      font-size="340"
      font-weight="900"
      text-anchor="middle"
      dominant-baseline="central"
      fill="#b91f1a">汉</text>
  </g>

  <g filter="url(#cardShadow)">
    <circle cx="704" cy="728" r="86" fill="url(#goldGrad)" stroke="#fff8e8" stroke-width="24"/>
    <path d="M662 729 L694 760 L750 688" fill="none" stroke="#7a3b00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
