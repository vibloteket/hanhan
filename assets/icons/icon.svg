    <path d="M 60 12 Q 70 -26 86 -46" fill="none" stroke="#fff8e8" stroke-width="22" stroke-linecap="round"/>
    <circle cx="132" cy="-58" r="13" fill="#ffd9a0"/>
    <circle cx="90" cy="-52" r="11" fill="#ffd9a0"/>
    <circle cx="-58" cy="6" r="78" fill="#ffd9a0"/>
    <path d="M -58 6 m 0 -50 a 50 50 0 1 1 -36 16" fill="none" stroke="#bd271f" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-58" cy="6" r="16" fill="#bd271f"/>
  </g>
</svg>
