# Woodpecker CI for hanhan
# Triggers on every push to main

pipeline:
  check:
    image: node:20-alpine
    commands:
      - node --version
      - find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  test:
    image: node:20-alpine
    commands:
      - node --version
      - node --test test/

branches:
  include: [main]